name: Bug report
description: Report a reproducible gateway problem
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected / actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Gateway, Windows, Node and desktop versions
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Remove tokens, private paths, native conversation contents and account details.
